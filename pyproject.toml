[project]
name = "cp4285-proj"
version = "0.1.0"
description = "Bias-panel pipeline for debiasing recommenders on KuaiRand-Pure"
readme = "README.md"
authors = [
    { name = "xplus2g4", email = "xplus2g4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mlflow>=3.0",
    "numpy>=2.0",
    "polars>=1.0",
    "scipy>=1.13",
    "torch>=2.7",
    "tqdm>=4.66",
]

[project.scripts]
kr-preprocess = "cp4285_proj.cli:preprocess_main"
kr-train      = "cp4285_proj.cli:train_main"
kr-sweep      = "cp4285_proj.cli:sweep_main"
kr-evaluate   = "cp4285_proj.cli:evaluate_main"
kr-rescore    = "cp4285_proj.cli:rescore_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
