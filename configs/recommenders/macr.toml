# MACR (Wei et al., KDD '21) on the MF backbone (spec §13.5).
# Frontier: sweep `c`.
[model]
embedding_dim = 64
alpha = 1e-3        # item-module loss weight (paper default)
beta = 1e-3         # user-module loss weight (paper default)
c = 0.0             # reference value of the matching logit at inference; 0 = total effect

[train]
optimizer = "adam"
lr = 3e-3
weight_decay = 1e-6
batch_size = 8192
max_epochs = 50
patience = 5

[search]           # the MF grid: every method tunes the shared backbone the same way
lr = [1e-3, 3e-3, 1e-2]
weight_decay = [0.0, 1e-6, 1e-5]
