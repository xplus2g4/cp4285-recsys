# Naive MF (spec §5.3). Recommender-owned: hyperparameters, optimisation, search space.
[model]
embedding_dim = 64

[train]
optimizer = "adam"
lr = 3e-3
weight_decay = 1e-6
batch_size = 8192
max_epochs = 50
patience = 5

[search]           # recommender-owned search space
lr = [1e-3, 3e-3, 1e-2]
weight_decay = [0.0, 1e-6, 1e-5]
