<section class="lede">
  <p class="body">Recommenders learn from <b>what users were shown</b>, not from what they would have liked. Debiasing methods fix this <b>one bias at a time</b> and are judged on accuracy alone [2]. We measured <b>every</b> bias on randomly exposed videos [1] and asked: <i>when a method removes its bias, where does the bias go?</i></p>
