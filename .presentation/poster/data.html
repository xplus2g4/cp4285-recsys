<style>
  .ev { display: grid; grid-template-columns: 220px 1fr; gap: 24px; align-items: start; padding: 16px 0; border-top: 2px solid var(--soft); }
  .ev:first-child { border-top: none; padding-top: 4px; }
  .ev .tag { font-family: Fraunces; font-weight: 800; font-size: 44px; line-height: 1; padding-top: 6px; }
  .ev .tag small { display: block; font-family: Inter; font-weight: 400; font-size: 27px; color: var(--sub); margin-top: 8px; line-height: 1.25; }
  .ev p { margin-top: 4px; }
</style>

<div>
  <div class="sec-head"><h2>Data analysis</h2><span class="mono" id="data-head"></span></div>
  <div id="evidence"></div>
</div>

<script>
// ---- data analysis: bias evidence in the logs ----
{
  const k = (v) => (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : (v / 1e3).toFixed(1) + "K");
  document.getElementById("data-head").innerHTML =
    `KuaiRand [1] · ${k(F.rows.train + F.rows.calibration + F.rows.test)} interactions<br>${k(F.users.train)} users · ${k(F.n_items)} videos`;

  const bar = (parts, w = 1210, h = 54) => {
    let x = 0, s = `<svg width="${w}" height="${h + 8}" viewBox="0 0 ${w} ${h + 8}">`;
    parts.forEach(([v, color, label, fill = "#fff", outside = false]) => {
      const bw = v * w;
      s += `<rect x="${x}" y="4" width="${bw}" height="${h}" fill="${color}"/>`;
      if (label) s += T(x + (outside ? bw : 0) + 16, 4 + h / 2 + 10, label, { size: 28, weight: 700, fill });
      x += bw;
    });
    return s + "</svg>";
  };
  const head = F.head_share_exposure, meanPop = F.n_train_rows / F.n_items;
  const cr = F.positive_rates, std = cr.train.click, rnd = cr.test.click;
  const v = F.median_dur_by_pop_quintile_s, w = 1210, h = 150, lo = 60, bw = w / v.length;
  let q = `<svg width="${w}" height="${h + 44}" viewBox="0 0 ${w} ${h + 44}">`;
  v.forEach((d, i) => {
    const bh = ((d - lo) / (Math.max(...v) - lo)) * (h - 44), x = i * bw + 12, y = h - bh;
    q += `<rect x="${x}" y="${y}" width="${bw - 24}" height="${bh}" fill="${i === v.length - 1 ? COL.dur : "#c9ccd2"}"/>`;
    q += T(x + (bw - 24) / 2, y - 10, d.toFixed(0) + " s", { size: 28, weight: 700, anchor: "middle" });
  });
  q += `<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${COL.ink}" stroke-width="3"/>`;
  q += T(12, h + 36, "least popular fifth", { size: 26, fill: COL.sub }) + T(w - 12, h + 36, `most popular fifth · bars start at ${lo} s`, { size: 26, fill: COL.sub, anchor: "end" });
  q += "</svg>";
  const rows = [
    ["Popularity", COL.pop, "who gets shown", bar([[head, COL.pop, `top 20% of videos get ${(100 * head).toFixed(0)}% of training exposures`], [1 - head, "#e5e7eb", "", COL.sub]]),
      `Naive MF amplifies this: its top-10 videos average ${num(mean(naive, "arp@10"))} training exposures, against ${num(meanPop)} for the average video.`],
    ["Exposure", COL.exp, "what gets clicked", bar([[std, COL.exp, `standard log: ${(100 * std).toFixed(0)}% clicked`]]) + bar([[rnd, "#7fb8b1", `random log: ${(100 * rnd).toFixed(0)}% clicked`, COL.ink, true]]),
      `The logging policy shows what users already click, so logged feedback overstates relevance.`],
    ["Duration", COL.dur, "popular = shorter", q,
      `The link is weak overall (Spearman ρ = ${signed(F.rho_pop_dur, 2)}) but sits at the head: the 200 most-shown videos have a median of ${F.median_dur_top200_s.toFixed(0)} s against ${F.median_dur_pool_s.toFixed(0)} s.`],
  ];
  document.getElementById("evidence").innerHTML = rows.map(([t, c, sub, chart, text]) =>
    `<div class="ev"><div class="tag" style="color:${c}">${t}<small>${sub}</small></div><div>${chart}<p>${text}</p></div></div>`).join("") +
    `<p class="note" style="margin-top:4px">Sanity check: the random log spreads exposures almost evenly over its item pool (coefficient of variation ${F.random_item_cv.toFixed(2)}), so it can serve as an unbiased test set.</p>`;
}
</script>
